services:
  postgres:
    image: postgres:17-alpine
    container_name: coffee-orders-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: coffee_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - coffee_orders_data:/var/lib/postgresql/data

volumes:
  coffee_orders_data: